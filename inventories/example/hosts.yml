---
# Copie para inventories/lab/ (ignorado pelo Git):   make lab-init
all:
  children:
    hardening:
      hosts:
        lab-01:
          ansible_host: 203.0.113.10 # ← IP do seu servidor/VM
      vars:
        # Estado FINAL (steady state): conta de automação na porta endurecida.
        # A 1ª execução (make bootstrap) sobrescreve estes dois valores com
        # BOOTSTRAP_USER/BOOTSTRAP_PORT, pois o servidor ainda está "de fábrica".
        ansible_user: ansible
        ansible_port: 2222
        ansible_python_interpreter: /usr/bin/python3
        # ansible_ssh_private_key_file: ~/.ssh/hardening_lab
