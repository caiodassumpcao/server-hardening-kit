[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
forks = 10
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
# Diff sempre ligado: em modo --check é ele que mostra o que está fora de conformidade.
# (pode ser desligado com ANSIBLE_DIFF_ALWAYS=false)
diff_always = True

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
# ControlPersist reaproveita a conexão SSH: menos handshakes, o que convive bem
# com o rate limit (ufw limit) e com o fail2ban aplicados pelo próprio kit.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
