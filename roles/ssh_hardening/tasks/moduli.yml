---
- name: Count weak Diffie-Hellman moduli (< 3071 bits)
  ansible.builtin.command:
    argv: [awk, '$1 !~ /^#/ && $5 < 3071 { n++ } END { print n + 0 }', /etc/ssh/moduli]
  register: ssh_hardening_weak_moduli
  changed_when: false
  check_mode: false
  failed_when: false

- name: Remove weak Diffie-Hellman moduli
  ansible.builtin.shell: |
    set -o pipefail
    awk '$1 ~ /^#/ || $5 >= 3071' /etc/ssh/moduli > /etc/ssh/moduli.hardened
    mv /etc/ssh/moduli.hardened /etc/ssh/moduli
    chmod 0644 /etc/ssh/moduli
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - ssh_hardening_weak_moduli.rc | default(1) == 0
    - ssh_hardening_weak_moduli.stdout | default('0') | int > 0
  notify: Restart sshd
