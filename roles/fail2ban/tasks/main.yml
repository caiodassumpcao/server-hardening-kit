---
- name: Install fail2ban (with journald backend support)
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present

- name: Ensure fail2ban log exists (read by the recidive jail on first start)
  ansible.builtin.copy:
    dest: /var/log/fail2ban.log
    content: ""
    force: false
    owner: root
    group: adm
    mode: "0640"

- name: Deploy jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  when: not ansible_check_mode or 'fail2ban' in ansible_facts['packages']
