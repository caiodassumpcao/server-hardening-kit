---
- name: CIS 1.2.2.1 | Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable periodic package list refresh and unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# Arquivo próprio (52-) em vez de editar o 50unattended-upgrades do pacote:
# upgrades do pacote não geram conflito de conffile, e o "#clear" zera as
# listas herdadas antes de redefini-las.
- name: Configure unattended-upgrades policy
  ansible.builtin.template:
    src: 52unattended-upgrades-hardening.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-hardening
    owner: root
    group: root
    mode: "0644"

- name: Ensure unattended-upgrades service is enabled
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
  when: not ansible_check_mode or 'unattended-upgrades' in ansible_facts['packages']

- name: Ensure apt timers are enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  when: unattended_upgrades_manage_timers | bool
